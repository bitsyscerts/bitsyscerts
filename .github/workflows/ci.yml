name: CI / CD

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  API_IMAGE: ghcr.io/bitsyscerts/bitsyscerts-api
  APP_IMAGE: ghcr.io/bitsyscerts/bitsyscerts-app

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  # ── Version generation ──────────────────────────────────────────────────────
  # Single source of truth: .github/scripts/gen-version.sh
  # Format: yy.mdd.hhmm (main) | yy.mdd.hhmm+branch.sha (PEP 440, non-main)
  #         yy.mdd.hhmm-branch-sha (Docker, non-main)
  version:
    name: "Generate version"
    runs-on: ubuntu-latest
    outputs:
      version_core: ${{ steps.gen.outputs.version_core }}
      version_pep440: ${{ steps.gen.outputs.version_pep440 }}
      version_docker: ${{ steps.gen.outputs.version_docker }}
      branch_safe: ${{ steps.gen.outputs.branch_safe }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Generate version strings
        id: gen
        run: |
          source .github/scripts/gen-version.sh
          BRANCH_SAFE="${GITHUB_REF_NAME//\//-}"
          echo "version_core=$VERSION_CORE"     >> "$GITHUB_OUTPUT"
          echo "version_pep440=$VERSION_PEP440" >> "$GITHUB_OUTPUT"
          echo "version_docker=$VERSION_DOCKER" >> "$GITHUB_OUTPUT"
          echo "branch_safe=$BRANCH_SAFE"       >> "$GITHUB_OUTPUT"

  # ── SAST: Semgrep ────────────────────────────────────────────────────────────
  # Findings are surfaced in the GitHub Security tab (SARIF upload).
  # This is a hard gate: any Semgrep finding blocks the gate job and prevents
  # publish/deploy steps from running.
  semgrep:
    name: "Scan - SAST (Semgrep)"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Semgrep
        run: pip install semgrep --quiet

      - name: Run Semgrep SAST
        run: semgrep scan --config=auto --sarif --output=semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
        with:
          sarif_file: semgrep.sarif
        if: always()

  # ── Build · API image (candidate) ──────────────────────────────────────────
  # Builds once and pushes a candidate tag so CVA can scan the real image.
  # The promote job applies final version / latest tags only after all gates
  # and scans pass — no image is downloaded; promotion is registry-side only.
  build-api:
    name: "Build · API image (candidate)"
    runs-on: ubuntu-latest
    needs: [version]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: src/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:candidate-${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ needs.version.outputs.version_docker }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build · App image (candidate) ──────────────────────────────────────────
  build-app:
    name: "Build · App image (candidate)"
    runs-on: ubuntu-latest
    needs: [version]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: src/app/Dockerfile
          push: true
          tags: ${{ env.APP_IMAGE }}:candidate-${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ needs.version.outputs.version_docker }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Python: certsapi tests ──────────────────────────────────────────────────
  test-api:
    name: "Test · certsapi"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ctpool and certsapi with dev dependencies
        run: |
          # Build ctpool wheel from the checked-out source
          pip wheel --no-cache-dir --wheel-dir /tmp/wheels ../ctpool
          pip install --no-cache-dir --find-links /tmp/wheels -e ".[dev]"

      - name: Run tests (lint + coverage)
        # --cov-report=xml is additive; term-missing is already set in addopts
        run: pytest --cov-report=xml:coverage.xml

      - name: Coverage summary
        if: always()
        run: |
          echo "## certsapi coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" \
            || echo "_Coverage data unavailable_" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: src/api/coverage.xml
          flags: api
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # ── Python: ctpool tests ────────────────────────────────────────────────────
  test-ctpool:
    name: "Test · ctpool"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ctpool_test
          POSTGRES_USER: ctpool
          POSTGRES_PASSWORD: ctpool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctpool -d ctpool_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://ctpool:ctpool@localhost:5432/ctpool_test
    defaults:
      run:
        working-directory: src/ctpool

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ctpool with dev dependencies
        run: pip install --no-cache-dir -e ".[dev]"

      - name: Run tests (lint + coverage)
        run: pytest --cov-report=xml:coverage.xml

      - name: Coverage summary
        if: always()
        run: |
          echo "## ctpool coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" \
            || echo "_Coverage data unavailable_" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: src/ctpool/coverage.xml
          flags: ctpool
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # ── Frontend: React/TypeScript tests ───────────────────────────────────────
  test-app:
    name: "Test · frontend"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # required by vitest-coverage-report-action for PR comments
    defaults:
      run:
        working-directory: src/app

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.2.2

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: src/app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests (coverage)
        run: pnpm test:coverage

      - name: Coverage summary
        uses: davelosert/vitest-coverage-report-action@02f3c2e641286b7fa308cd3e430783103ce6103b # v2.12.0
        with:
          json-summary-path: src/app/coverage/coverage-summary.json
          vite-config-path: src/app/vite.config.ts
        if: always()

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: src/app/coverage/lcov.info
          flags: app
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # ── SCA: OSV Scanner ────────────────────────────────────────────────────────
  # Software Composition Analysis across all three dependency manifests.
  # Fails on any HIGH or CRITICAL finding (SARIF level "error").
  # SARIF is always uploaded to the GitHub Security tab so that lower-severity
  # findings remain visible even when the gate passes.
  scan-sca:
    name: "Scan · SCA (OSV Scanner)"
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install OSV Scanner
        run: |
          ARCH=$(uname -m)
          [[ "$ARCH" == "aarch64" ]] && SLUG="linux_arm64" || SLUG="linux_amd64"
          curl -fsSL \
            "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_${SLUG}" \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner

      - name: Scan all lockfiles
        run: |
          # || true: exit 1 = vulns found (handled by severity gate below);
          #          exit 2 = scanner error (also caught below via missing file).
          osv-scanner scan source \
            --lockfile src/app/pnpm-lock.yaml \
            --format sarif \
            --output-file osv.sarif \
            src/api src/ctpool \
          || true

      - name: Fail on HIGH / CRITICAL findings
        run: |
          python3 - <<'EOF'
          import json, os, sys

          def load_findings():
              if not os.path.exists("osv.sarif") or os.path.getsize("osv.sarif") == 0:
                  print("WARN: osv.sarif missing or empty — scanner may have errored")
                  return None
              data = json.load(open("osv.sarif"))
              rows = []
              for run in data.get("runs", []):
                  for r in run.get("results", []):
                      if r.get("level") != "error":
                          continue
                      rows.append({"id": r.get("ruleId", "?"),
                                   "msg": r.get("message", {}).get("text", "").partition("\n")[0]})
              return rows

          def write_summary(rows):
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if not path:
                  return
              with open(path, "a") as fh:
                  if not rows:
                      fh.write("## \u2705 SCA \u2014 no HIGH/CRITICAL findings\n")
                      return
                  fh.write(f"## \u26d4 SCA \u2014 {len(rows)} HIGH/CRITICAL finding(s)\n\n")
                  fh.write("|Vulnerability|Details|\n|---|---|\n")
                  for r in rows:
                      fh.write(f"| `{r['id']}` | {r['msg'][:150]} |\n")
                  fh.write("\n> Update the affected dependency to clear this gate.\n")

          rows = load_findings()
          if rows is None:
              sys.exit(0)
          write_summary(rows)
          if rows:
              print(f"FAIL \u2014 {len(rows)} HIGH/CRITICAL finding(s) in dependencies:\n")
              for r in rows[:20]:
                  print(f"  {r['id']}: {r['msg']}")
              sys.exit(1)
          print("OK: no HIGH/CRITICAL vulnerabilities found in dependencies")
          EOF

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
        with:
          sarif_file: osv.sarif
          category: sca-osv
        if: always() && hashFiles('osv.sarif') != ''

  # ── CVA: Trivy ──────────────────────────────────────────────────────────────
  # Container Vulnerability Analysis on the candidate images built by build-api
  # and build-app.  Fails on any CRITICAL or HIGH OS-package or dependency
  # finding.  SARIF is always uploaded to the GitHub Security tab.
  scan-cva:
    name: "Scan · CVA (Trivy)"
    runs-on: ubuntu-latest
    needs: [build-api, build-app]
    if: github.event_name == 'push'
    permissions:
      security-events: write
      packages: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan · API candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}:candidate-${{ github.sha }}
          format: "template"
          template: "@/contrib/sarif.tpl"
          output: trivy-api.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0" # never fail here; gate step below owns pass/fail

      - name: Upload Trivy SARIF · API
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
        with:
          sarif_file: trivy-api.sarif
          category: cva-trivy-api
        if: always() && hashFiles('trivy-api.sarif') != ''

      - name: Trivy scan · App candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always() # run even if API scan step fails for a non-vuln reason
        with:
          image-ref: ${{ env.APP_IMAGE }}:candidate-${{ github.sha }}
          format: "template"
          template: "@/contrib/sarif.tpl"
          output: trivy-app.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0" # never fail here; gate step below owns pass/fail

      - name: Upload Trivy SARIF · App
        uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
        with:
          sarif_file: trivy-app.sarif
          category: cva-trivy-app
        if: always() && hashFiles('trivy-app.sarif') != ''

      - name: Fail on HIGH / CRITICAL findings
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, re, sys

          SCANS = {"trivy-api.sarif": "API", "trivy-app.sarif": "App"}

          def parse_msg(text):
              fields = {}
              for line in text.splitlines():
                  if ": " in line:
                      k, _, v = line.partition(": ")
                      fields[k.strip()] = v.strip()
              m = re.search(r'\(https?://[^)]+\)', text)
              fields["url"] = m.group(0)[1:-1] if m else ""
              return fields

          def load_findings():
              rows = []
              for fname, label in SCANS.items():
                  if not os.path.exists(fname) or os.path.getsize(fname) == 0:
                      print(f"WARN: {fname} missing or empty — scan may have errored")
                      continue
                  data = json.load(open(fname))
                  for run in data.get("runs", []):
                      for r in run.get("results", []):
                          if r.get("level") not in ("error", "warning"):
                              continue
                          f = parse_msg(r.get("message", {}).get("text", ""))
                          rows.append({
                              "image": label, "cve": r.get("ruleId", "?"),
                              "severity": f.get("Severity", "?"),
                              "package": f.get("Package", "?"),
                              "installed": f.get("Installed Version", "?"),
                              "fixed": f.get("Fixed Version") or "",
                              "url": f.get("url", ""),
                              "level": r.get("level"),
                          })
              return rows

          def categorize(rows):
              blocking  = [r for r in rows if r["level"] == "error" and r["fixed"]]
              unpatched = [r for r in rows if r["level"] == "error" and not r["fixed"]]
              medium    = [r for r in rows if r["level"] == "warning"]
              return blocking, unpatched, medium

          def md_row(r, show_fixed=True):
              cve = f"[{r['cve']}]({r['url']})" if r["url"] else r["cve"]
              base = f"| {r['image']} | {cve} | **{r['severity']}** | `{r['package']}` | `{r['installed']}`"
              return base + (f" | `{r['fixed']}` |\n" if show_fixed else " |\n")

          def write_blocking(fh, rows):
              if rows:
                  fh.write(f"## \\u26d4 CVA \\u2014 {len(rows)} HIGH/CRITICAL with fix available\\n\\n")
                  fh.write("|Image|CVE|Sev|Package|Installed|Fix|\\n|---|---|---|---|---|---|\\n")
                  for r in rows:
                      fh.write(md_row(r, show_fixed=True))
                  fh.write("\\n> Upgrade the package(s) above in the relevant Dockerfile to clear this gate.\\n\\n")
              else:
                  fh.write("## \\u2705 CVA \\u2014 no actionable HIGH/CRITICAL findings\\n\\n")

          def write_detail(fh, icon, label, rows, show_fixed):
              if not rows:
                  return
              fh.write(f"<details><summary>{icon} {len(rows)} {label} (not blocking)</summary>\\n\\n")
              if show_fixed:
                  fh.write("|Image|CVE|Sev|Package|Installed|Fix|\\n|---|---|---|---|---|---|\\n")
              else:
                  fh.write("|Image|CVE|Sev|Package|Installed|\\n|---|---|---|---|---|\\n")
              for r in rows:
                  fh.write(md_row(r, show_fixed=show_fixed))
              fh.write("\\n</details>\\n\\n")

          def write_summary(rows):
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if not path:
                  return
              blocking, unpatched, medium = categorize(rows)
              with open(path, "a") as fh:
                  write_blocking(fh, blocking)
                  write_detail(fh, "\\u26a0\\ufe0f", "HIGH/CRITICAL unpatched (no fix yet)", unpatched, False)
                  write_detail(fh, "\\u2139\\ufe0f", "MEDIUM findings", medium, True)

          def print_table(label, rows):
              if not rows:
                  return
              W = (5, 20, 8, 30, 22, 14)
              cols = ("IMAGE", "CVE", "SEV", "PACKAGE", "INSTALLED", "FIX AVAILABLE")
              fmt = "  ".join(f"{{:<{w}}}" for w in W)
              print(f"\\n  {label}:")
              print(fmt.format(*cols))
              print("  ".join("-" * w for w in W))
              for r in rows:
                  print(fmt.format(r["image"], r["cve"], r["severity"],
                                   r["package"][:W[3]], r["installed"], r["fixed"] or "none yet"))

          rows = load_findings()
          blocking, unpatched, medium = categorize(rows)
          write_summary(rows)
          if blocking:
              print(f"FAIL \\u2014 {len(blocking)} HIGH/CRITICAL finding(s) with fix available:\\n")
              print_table("BLOCKING", blocking)
              print_table("UNPATCHED HIGH/CRITICAL (informational)", unpatched)
              print_table("MEDIUM (informational)", medium)
              sys.exit(1)
          if unpatched or medium:
              print(f"OK \\u2014 no blocking CVEs. Informational findings below:")
              print_table("UNPATCHED HIGH/CRITICAL", unpatched)
              print_table("MEDIUM", medium)
          else:
              print("OK: no vulnerabilities found in container images")
          EOF

  # ── CI gate ─────────────────────────────────────────────────────────────────
  # True fan-in point: every left-side job must pass before anything on the
  # right (promote, packages, release) is allowed to run.  On push events this
  # includes the candidate builds and CVA scan; on pull_request events those
  # are skipped and GitHub Actions treats skipped jobs as passing, so gate
  # still runs against tests + SAST + SCA only.
  gate:
    name: "Gate · all checks passed"
    runs-on: ubuntu-latest
    needs: [semgrep, test-api, test-ctpool, test-app, scan-sca, scan-cva]
    steps:
      - name: All checks passed
        run: echo "All validation jobs passed — proceeding to publish."

  # ── Promote · images to final tags ─────────────────────────────────────────
  # All gates and CVA scan passed.  Re-tag candidate images using a pure
  # registry-side manifest copy (docker buildx imagetools create) — no image
  # download required.
  promote:
    name: "Promote · images"
    runs-on: ubuntu-latest
    needs: [version, gate]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Promote API image
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            LATEST_TAG="${{ env.API_IMAGE }}:latest"
          else
            LATEST_TAG="${{ env.API_IMAGE }}:latest-${{ needs.version.outputs.branch_safe }}"
          fi
          docker buildx imagetools create \
            --tag "${{ env.API_IMAGE }}:${{ needs.version.outputs.version_docker }}" \
            --tag "${LATEST_TAG}" \
            "${{ env.API_IMAGE }}:candidate-${{ github.sha }}"

      - name: Promote App image
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            LATEST_TAG="${{ env.APP_IMAGE }}:latest"
          else
            LATEST_TAG="${{ env.APP_IMAGE }}:latest-${{ needs.version.outputs.branch_safe }}"
          fi
          docker buildx imagetools create \
            --tag "${{ env.APP_IMAGE }}:${{ needs.version.outputs.version_docker }}" \
            --tag "${LATEST_TAG}" \
            "${{ env.APP_IMAGE }}:candidate-${{ github.sha }}"

      - name: Published images summary
        run: |
          VER="${{ needs.version.outputs.version_docker }}"
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            LATEST_SUFFIX="latest"
          else
            LATEST_SUFFIX="latest-${{ needs.version.outputs.branch_safe }}"
          fi
          {
            echo "## Published images"
            echo ""
            echo "| Image | Tags |"
            echo "| ----- | ---- |"
            echo "| [bitsyscerts-api](https://github.com/${{ github.repository }}/pkgs/container/bitsyscerts-api) | \`${VER}\` · \`${LATEST_SUFFIX}\` |"
            echo "| [bitsyscerts-app](https://github.com/${{ github.repository }}/pkgs/container/bitsyscerts-app) | \`${VER}\` · \`${LATEST_SUFFIX}\` |"
            echo ""
            echo '```shell'
            echo "docker pull ${{ env.API_IMAGE }}:${VER}"
            echo "docker pull ${{ env.APP_IMAGE }}:${VER}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  package-runtime-bundles:
    name: "Package · runtime bundles"
    runs-on: ubuntu-latest
    needs: [version, gate]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate compose configuration
        run: docker compose -f src/docker-compose.yml --env-file src/.env.compose.example config >/dev/null

      - name: Build runtime bundles
        run: |
          bash src/package-runtime-bundles.sh \
            --version "${{ needs.version.outputs.version_docker }}" \
            --output-dir /tmp/bitsyscerts-dist

      - name: Validate extracted runtime bundles
        run: |
          bash src/validate-runtime-bundles.sh \
            --compose-bundle /tmp/bitsyscerts-dist/bitsyscerts-compose-${{ needs.version.outputs.version_docker }}.zip \
            --python-bundle /tmp/bitsyscerts-dist/bitsyscerts-python-${{ needs.version.outputs.version_docker }}.zip

      - name: Upload runtime bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-bundles
          path: |
            /tmp/bitsyscerts-dist/bitsyscerts-compose-${{ needs.version.outputs.version_docker }}.zip
            /tmp/bitsyscerts-dist/bitsyscerts-python-${{ needs.version.outputs.version_docker }}.zip

  # ── GitHub Release (main) ────────────────────────────────────────────────────
  # Creates a versioned stable release on every successful main build.
  # Tag format: v{version_core}  e.g. v26.508.1542
  release:
    name: "GitHub Release"
    runs-on: ubuntu-latest
    needs: [version, promote, package-runtime-bundles]
    if: github.ref_name == 'main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download runtime bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-bundles
          path: /tmp/runtime-bundles

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: "v${{ needs.version.outputs.version_core }}"
          name: "v${{ needs.version.outputs.version_core }}"
          generate_release_notes: true
          make_latest: true
          files: |
            /tmp/runtime-bundles/bitsyscerts-compose-${{ needs.version.outputs.version_docker }}.zip
            /tmp/runtime-bundles/bitsyscerts-python-${{ needs.version.outputs.version_docker }}.zip
          body: |
            ### Container images

            ```
            docker pull ghcr.io/bitsyscerts/bitsyscerts-api:${{ needs.version.outputs.version_docker }}
            docker pull ghcr.io/bitsyscerts/bitsyscerts-app:${{ needs.version.outputs.version_docker }}
            ```

            ### Runtime bundles

            - `bitsyscerts-compose-${{ needs.version.outputs.version_docker }}.zip`
            - `bitsyscerts-python-${{ needs.version.outputs.version_docker }}.zip`

            See the [README](https://github.com/bitsyscerts/bitsyscerts#docker-compose-quick-start-preferred) for setup instructions.

      - name: Release summary
        run: |
          {
            echo "## GitHub Release"
            echo ""
            echo "**[${{ steps.create-release.outputs.url }}](${{ steps.create-release.outputs.url }})**"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── GitHub Pre-Release (staging / develop / release/*) ──────────────────────
  # Creates a pre-release on every successful build from integration branches.
  # Tag format: v{version_docker}  e.g. v26.508.1542-staging-abc1234
  # A new pre-release is created per push (unique tag via commit SHA).
  pre-release:
    name: "GitHub Pre-Release"
    runs-on: ubuntu-latest
    needs: [version, promote, package-runtime-bundles]
    if: |
      github.event_name == 'push' && (
        github.ref_name == 'staging' ||
        github.ref_name == 'develop' ||
        startsWith(github.ref_name, 'release/')
      )
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download runtime bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-bundles
          path: /tmp/runtime-bundles

      - name: Create GitHub Pre-Release
        id: create-pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: "v${{ needs.version.outputs.version_docker }}"
          name: "v${{ needs.version.outputs.version_docker }}"
          prerelease: true
          generate_release_notes: true
          make_latest: false
          files: |
            /tmp/runtime-bundles/bitsyscerts-compose-${{ needs.version.outputs.version_docker }}.zip
            /tmp/runtime-bundles/bitsyscerts-python-${{ needs.version.outputs.version_docker }}.zip
          body: |
            > [!NOTE]
            > This is a pre-release build from the `${{ github.ref_name }}` branch.
            > It is not recommended for production use.

            ### Container images

            ```
            docker pull ghcr.io/bitsyscerts/bitsyscerts-api:${{ needs.version.outputs.version_docker }}
            docker pull ghcr.io/bitsyscerts/bitsyscerts-app:${{ needs.version.outputs.version_docker }}
            ```

            ### Runtime bundles

            - `bitsyscerts-compose-${{ needs.version.outputs.version_docker }}.zip`
            - `bitsyscerts-python-${{ needs.version.outputs.version_docker }}.zip`

            See the [README](https://github.com/bitsyscerts/bitsyscerts#docker-compose-quick-start-preferred) for setup instructions.

      - name: Pre-release summary
        run: |
          {
            echo "## GitHub Pre-Release"
            echo ""
            echo "**[${{ steps.create-pre-release.outputs.url }}](${{ steps.create-pre-release.outputs.url }})**"
          } >> "$GITHUB_STEP_SUMMARY"
