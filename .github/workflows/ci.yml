name: CI / CD

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  API_IMAGE: ghcr.io/bitsyscerts/bitsyscerts-api
  APP_IMAGE: ghcr.io/bitsyscerts/bitsyscerts-app

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  # ── Version generation ──────────────────────────────────────────────────────
  # Single source of truth: .github/scripts/gen-version.sh
  # Format: yy.mdd.hhmm (main) | yy.mdd.hhmm+branch.sha (PEP 440, non-main)
  #         yy.mdd.hhmm-branch-sha (Docker, non-main)
  version:
    name: "Generate version"
    runs-on: ubuntu-latest
    outputs:
      version_core: ${{ steps.gen.outputs.version_core }}
      version_pep440: ${{ steps.gen.outputs.version_pep440 }}
      version_docker: ${{ steps.gen.outputs.version_docker }}
      branch_safe: ${{ steps.gen.outputs.branch_safe }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate version strings
        id: gen
        run: |
          source .github/scripts/gen-version.sh
          BRANCH_SAFE="${GITHUB_REF_NAME//\//-}"
          echo "version_core=$VERSION_CORE"     >> "$GITHUB_OUTPUT"
          echo "version_pep440=$VERSION_PEP440" >> "$GITHUB_OUTPUT"
          echo "version_docker=$VERSION_DOCKER" >> "$GITHUB_OUTPUT"
          echo "branch_safe=$BRANCH_SAFE"       >> "$GITHUB_OUTPUT"

  # ── SAST: Semgrep ────────────────────────────────────────────────────────────
  # Findings are surfaced in the GitHub Security tab (SARIF upload).
  # The scan step is non-blocking (continue-on-error: true) so pre-existing
  # findings do not stall CI. Remove continue-on-error once the initial findings
  # have been triaged to promote this to a hard gate.
  semgrep:
    name: "SAST · Semgrep"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep --quiet

      - name: Run Semgrep SAST
        run: semgrep scan --config=auto --sarif --output=semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()

  # ── Python: certsapi tests ──────────────────────────────────────────────────
  test-api:
    name: "Test · certsapi"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ctpool and certsapi with dev dependencies
        run: |
          # Build ctpool wheel from the checked-out source
          pip wheel --no-cache-dir --wheel-dir /tmp/wheels ../ctpool
          # Strip the file:// URL specifier from the local dev dependency so pip
          # can resolve ctpool from the wheel we just built (same technique as
          # the production Dockerfile).
          sed -i 's|ctpool @ file://[^"]*|ctpool|g' pyproject.toml
          pip install --no-cache-dir --find-links /tmp/wheels -e ".[dev]"

      - name: Run tests (lint + coverage)
        # --cov-report=xml is additive; term-missing is already set in addopts
        run: pytest --cov-report=xml:coverage.xml

      - name: Coverage summary
        if: always()
        run: |
          echo "## certsapi coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" \
            || echo "_Coverage data unavailable_" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: src/api/coverage.xml
          flags: api
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # ── Python: ctpool tests ────────────────────────────────────────────────────
  test-ctpool:
    name: "Test · ctpool"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ctpool_test
          POSTGRES_USER: ctpool
          POSTGRES_PASSWORD: ctpool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctpool -d ctpool_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://ctpool:ctpool@localhost:5432/ctpool_test
    defaults:
      run:
        working-directory: src/ctpool

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ctpool with dev dependencies
        run: pip install --no-cache-dir -e ".[dev]"

      - name: Run tests (lint + coverage)
        run: pytest --cov-report=xml:coverage.xml

      - name: Coverage summary
        if: always()
        run: |
          echo "## ctpool coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" \
            || echo "_Coverage data unavailable_" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: src/ctpool/coverage.xml
          flags: ctpool
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # ── Frontend: React/TypeScript tests ───────────────────────────────────────
  test-app:
    name: "Test · frontend"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # required by vitest-coverage-report-action for PR comments
    defaults:
      run:
        working-directory: src/app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests (lint + coverage)
        run: npm run test

      - name: Coverage summary
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: src/app/coverage/coverage-summary.json
        if: always()

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: src/app/coverage/lcov.info
          flags: app
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # ── Build & push: API image (certsapi + ctpool) ─────────────────────────────
  # This single image serves both the REST API and the ctpool ingest workers.
  # Override CMD in docker-compose to run a ctpool worker instead of the API.
  build-push-api:
    name: "Build & push · API image"
    runs-on: ubuntu-latest
    needs: [version, test-api, test-ctpool]
    # Build on every push (any branch); skip pull_request events to avoid
    # double builds on same-repo PRs.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          # main     → <version>  +  latest
          # non-main → <version>  +  latest-<branch>
          tags: |
            type=raw,value=${{ needs.version.outputs.version_docker }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=latest-${{ needs.version.outputs.branch_safe }},enable=${{ github.ref_name != 'main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ needs.version.outputs.version_docker }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build & push: App image (React / Nginx) ─────────────────────────────────
  build-push-app:
    name: "Build & push · App image"
    runs-on: ubuntu-latest
    needs: [version, test-app]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version_docker }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=latest-${{ needs.version.outputs.branch_safe }},enable=${{ github.ref_name != 'main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ needs.version.outputs.version_docker }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── GitHub Release ───────────────────────────────────────────────────────────
  # Creates a versioned release on every successful main build. The release tag
  # is also the container image tag pushed to GHCR in the build-push-* jobs.
  release:
    name: "GitHub Release"
    runs-on: ubuntu-latest
    needs: [version, build-push-api, build-push-app]
    if: github.ref_name == 'main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version_core }}
          name: "${{ needs.version.outputs.version_core }}"
          generate_release_notes: true
          make_latest: true
          body: |
            ### Container images

            ```
            docker pull ghcr.io/bitsyscerts/bitsyscerts-api:${{ needs.version.outputs.version_docker }}
            docker pull ghcr.io/bitsyscerts/bitsyscerts-app:${{ needs.version.outputs.version_docker }}
            ```

            See the [README](https://github.com/bitsyscerts/bitsyscerts#quick-start-self-hosted) for setup instructions.
