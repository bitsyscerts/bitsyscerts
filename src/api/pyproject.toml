[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "certsapi"
version = "0.1.0"
description = "BitsyCerts read-only REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.47.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "sqlalchemy[asyncio]==2.0.49",
    "psycopg[binary]==3.3.4",
    "scalar-fastapi==1.8.2",
    "ctpool==0.1.0",
]

[project.scripts]
certsapi = "certsapi.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "anyio==4.13.0",
    "ruff==0.15.13",
    "mypy==1.20.2",
]

[tool.hatch.build.targets.wheel]
packages = ["certsapi"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "PTH"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "scalar_fastapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ctpool.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as requiring a live database (deselect with '-m not integration')",
]
addopts = "--cov=certsapi --cov-report=term-missing --cov-fail-under=75 -m 'not integration'"

[tool.coverage.run]
source = ["certsapi"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
