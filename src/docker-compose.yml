# BitsyCerts — production compose stack
#
# Run from the directory containing this file:
#   cp .env.compose.example .env
#   docker compose up -d
#
# The migrate service automatically applies migrations, syncs CT log sources,
# and writes an initial stats snapshot on first start.  All other services
# wait for it to complete before starting.
#
# For manual operator tasks use the migrate service image directly, e.g.:
#   docker compose run --rm migrate ctpool maintenance
#   docker compose run --rm migrate ctpool init-db --force
#
# Services:
#   postgres    — PostgreSQL 17 (omit if using an external managed DB)
#   migrate     — one-shot schema migration/tools service
#   api         — certsapi HTTP server (internal, port 8000)
#   frontend    — Nginx serving the React SPA; proxies /v1/* → api (port 80)
#   backfill    — ctpool backfill worker (long-running)
#   tail        — ctpool tail worker    (long-running)
#   stats-snapshotter — ctpool stats snapshot service (long-running)
#   maintenance — ctpool maintenance loop: prune + audit (long-running)

services:
  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bitsyscerts
      POSTGRES_USER: bitsyscerts
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitsyscerts"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── DB bootstrap (migrations + log sync + initial snapshot) ────────────────
  # For one-shot operator actions: docker compose run --rm migrate ctpool <cmd>
  migrate:
    image: "ghcr.io/bitsyscerts/bitsyscerts-api:${IMAGE_TAG:-latest}"
    restart: "no"
    env_file:
      - path: .env
        required: false
    # Run three bootstrap steps in order:
    #   1. apply-migrations  — bring the schema to head
    #   2. sync-logs         — upsert CT log sources so workers have targets
    #   3. stats-snapshot    — write an initial snapshot so the UI isn't stale
    command:
      - /bin/sh
      - -c
      - |
        ctpool apply-migrations &&
        ctpool sync-logs &&
        ctpool stats-snapshot
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    image: "ghcr.io/bitsyscerts/bitsyscerts-api:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    command: ["certsapi", "serve", "--workers", "2"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      BITSYSCERTS_EXPOSE_STATS_API: "${BITSYSCERTS_EXPOSE_STATS_API:-true}"
      CT_DB_CONTENTION_ENABLED: "${CT_DB_CONTENTION_ENABLED:-true}"
      CT_DB_CONTENTION_STALE_AFTER_SECONDS: "${CT_DB_CONTENTION_STALE_AFTER_SECONDS:-120}"
      CT_DEFAULT_BATCH_SIZE: "${CT_DEFAULT_BATCH_SIZE:-256}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import json,sys,urllib.request; body=json.load(urllib.request.urlopen(''http://127.0.0.1:8000/health'')); sys.exit(0 if body.get(''db'') == ''ok'' else 1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    image: "ghcr.io/bitsyscerts/bitsyscerts-app:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  # ── CT log backfill worker ──────────────────────────────────────────────────
  backfill:
    image: "ghcr.io/bitsyscerts/bitsyscerts-api:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    command: ["ctpool", "backfill"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      CT_BACKFILL_DAYS: "${CT_BACKFILL_DAYS:-30}"
      CT_BACKFILL_DISPATCH_MODE: "${CT_BACKFILL_DISPATCH_MODE:-per-log}"
      CT_DEFAULT_BATCH_SIZE: "${CT_DEFAULT_BATCH_SIZE:-256}"
      CT_MAX_BATCH_SIZE: "${CT_MAX_BATCH_SIZE:-1024}"
      CT_HTTP_TIMEOUT_SECONDS: "${CT_HTTP_TIMEOUT_SECONDS:-30}"
      CT_MIN_FREE_DISK_GB: "${CT_MIN_FREE_DISK_GB:-50}"
      CT_CRITICAL_FREE_DISK_GB: "${CT_CRITICAL_FREE_DISK_GB:-20}"
      CT_DISK_CHECK_PATH: "/data/pgcheck"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      # Read-only mount of the postgres data volume so the disk guard measures
      # the actual storage used by PostgreSQL, not the container overlay layer.
      - postgres_data:/data/pgcheck:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  # ── CT log tail worker ──────────────────────────────────────────────────────
  tail:
    image: "ghcr.io/bitsyscerts/bitsyscerts-api:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    command: ["ctpool", "tail"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      CT_BACKFILL_DISPATCH_MODE: "${CT_BACKFILL_DISPATCH_MODE:-per-log}"
      CT_TAIL_INTERVAL_SECONDS: "${CT_TAIL_INTERVAL_SECONDS:-300}"
      CT_DEFAULT_BATCH_SIZE: "${CT_DEFAULT_BATCH_SIZE:-256}"
      CT_MAX_BATCH_SIZE: "${CT_MAX_BATCH_SIZE:-1024}"
      CT_HTTP_TIMEOUT_SECONDS: "${CT_HTTP_TIMEOUT_SECONDS:-30}"
      CT_MIN_FREE_DISK_GB: "${CT_MIN_FREE_DISK_GB:-50}"
      CT_CRITICAL_FREE_DISK_GB: "${CT_CRITICAL_FREE_DISK_GB:-20}"
      CT_DISK_CHECK_PATH: "/data/pgcheck"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      # Read-only mount of the postgres data volume so the disk guard measures
      # the actual storage used by PostgreSQL, not the container overlay layer.
      - postgres_data:/data/pgcheck:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  # ── Stats snapshot service ─────────────────────────────────────────────────
  # Writes a full stats payload to ct_stats_snapshots on a regular interval
  # (default 300 s).  The API reads from the snapshot for cheap /v1/stats
  # responses, falling back to live queries when no fresh snapshot is available.
  stats-snapshotter:
    image: "ghcr.io/bitsyscerts/bitsyscerts-api:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    command: ["ctpool", "stats-snapshot", "--loop"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      CT_STATS_HEAVY_REFRESH_SECONDS: "${CT_STATS_HEAVY_REFRESH_SECONDS:-300}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  # ── Maintenance loop ────────────────────────────────────────────────────────
  # Runs periodic pruning of expired rows and audit-gap detection.
  # Default interval is 3600 s (1 hour).
  maintenance:
    image: "ghcr.io/bitsyscerts/bitsyscerts-api:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    command: ["ctpool", "maintenance", "--loop"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      BITSYSCERTS_ENABLE_SCHEDULED_AUDIT: "${BITSYSCERTS_ENABLE_SCHEDULED_AUDIT:-false}"
      CT_MAINTENANCE_INTERVAL_SECONDS: "${CT_MAINTENANCE_INTERVAL_SECONDS:-3600}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
