# BitsyCerts — production compose stack
#
# Run from the repository root:
#   docker compose -f src/docker-compose.yml <command>
#
# Before first use, copy src/.env.example to src/.env and fill in the values.
# Then deploy with:  ./src/deploy.sh
#
# Services:
#   postgres   — PostgreSQL 17 (omit if using an external managed DB)
#   migrate    — one-shot schema migration/bootstrap service
#   api        — certsapi HTTP server (internal, port 8000)
#   frontend   — Nginx serving the React SPA; proxies /v1/* → api (port 80)
#   backfill   — ctpool backfill worker (long-running)
#   tail       — ctpool tail worker    (long-running)

services:
  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bitsyscerts
      POSTGRES_USER: bitsyscerts
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitsyscerts"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── One-shot DB bootstrap and repair ───────────────────────────────────────
  # Use `docker compose run --rm migrate ctpool init-db --force` for a
  # destructive reset against the configured application database.
  migrate:
    image: "ghcr.io/bitsyscerts/bitsyscerts-api:${IMAGE_TAG:-latest}"
    restart: "no"
    env_file:
      - .env
    command: ["ctpool", "apply-migrations"]
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    image: "ghcr.io/bitsyscerts/bitsyscerts-api:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    command: ["certsapi", "serve", "--workers", "2"]
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      CT_DB_CONTENTION_ENABLED: "${CT_DB_CONTENTION_ENABLED:-true}"
      CT_DB_CONTENTION_STALE_AFTER_SECONDS: "${CT_DB_CONTENTION_STALE_AFTER_SECONDS:-120}"
      CT_DEFAULT_BATCH_SIZE: "${CT_DEFAULT_BATCH_SIZE:-256}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    image: "ghcr.io/bitsyscerts/bitsyscerts-app:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - internal

  # ── CT log backfill worker ──────────────────────────────────────────────────
  backfill:
    image: "ghcr.io/bitsyscerts/bitsyscerts-api:${IMAGE_TAG:-latest}"
    restart: on-failure
    command: ["ctpool", "backfill"]
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      CT_BACKFILL_DAYS: "${CT_BACKFILL_DAYS:-180}"
      CT_DEFAULT_BATCH_SIZE: "${CT_DEFAULT_BATCH_SIZE:-256}"
      CT_MAX_BATCH_SIZE: "${CT_MAX_BATCH_SIZE:-1024}"
      CT_HTTP_TIMEOUT_SECONDS: "${CT_HTTP_TIMEOUT_SECONDS:-30}"
      CT_MIN_FREE_DISK_GB: "${CT_MIN_FREE_DISK_GB:-50}"
      CT_CRITICAL_FREE_DISK_GB: "${CT_CRITICAL_FREE_DISK_GB:-20}"
      CT_DISK_CHECK_PATH: "/data/pgcheck"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      # Read-only mount of the postgres data volume so the disk guard measures
      # the actual storage used by PostgreSQL, not the container overlay layer.
      - postgres_data:/data/pgcheck:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  # ── CT log tail worker ──────────────────────────────────────────────────────
  tail:
    image: "ghcr.io/bitsyscerts/bitsyscerts-api:${IMAGE_TAG:-latest}"
    restart: on-failure
    command: ["ctpool", "tail"]
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      CT_TAIL_INTERVAL_SECONDS: "${CT_TAIL_INTERVAL_SECONDS:-300}"
      CT_DEFAULT_BATCH_SIZE: "${CT_DEFAULT_BATCH_SIZE:-256}"
      CT_MAX_BATCH_SIZE: "${CT_MAX_BATCH_SIZE:-1024}"
      CT_HTTP_TIMEOUT_SECONDS: "${CT_HTTP_TIMEOUT_SECONDS:-30}"
      CT_MIN_FREE_DISK_GB: "${CT_MIN_FREE_DISK_GB:-50}"
      CT_CRITICAL_FREE_DISK_GB: "${CT_CRITICAL_FREE_DISK_GB:-20}"
      CT_DISK_CHECK_PATH: "/data/pgcheck"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      # Read-only mount of the postgres data volume so the disk guard measures
      # the actual storage used by PostgreSQL, not the container overlay layer.
      - postgres_data:/data/pgcheck:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
